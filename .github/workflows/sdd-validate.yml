name: SDD-F v3.0 Validation

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  validate-specs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for drift detection

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install -g js-yaml

      - name: Validate specs
        run: |
          echo "Running SDD-F v3.0 validator..."
          node tools/sdd-validate-enhanced.js specs/ --ci
        continue-on-error: false

      - name: Check traceability
        run: |
          echo "Checking traceability matrix..."
          node -e "
            const fs = require('fs');
            const trace = JSON.parse(fs.readFileSync('specs/traceability.yaml', 'utf8'));
            const orphans = trace.specs.filter(s => 
              ['Task', 'Test', 'Implementation'].includes(s.type) && 
              (!s.parent || s.parent.length === 0)
            );
            if (orphans.length > 0) {
              console.error('❌ Orphan deliverables found:', orphans.map(o => o.id));
              process.exit(1);
            }
            console.log('✅ No orphan deliverables');
          "

      - name: Verify commit trailers
        if: github.event_name == 'pull_request'
        run: |
          echo "Checking commit trailers..."
          COMMITS=$(git log --format='%H %s' origin/${{ github.base_ref }}..HEAD)
          echo "$COMMITS" | while read commit subject; do
            if echo "$subject" | grep -qE '(Spec-Ref:|Bug-Ref:)'; then
              echo "✅ Commit has spec reference: $subject"
            else
              echo "⚠️  Commit missing spec reference: $subject"
            fi
          done

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdd-validation-report
          path: |
            specs/traceability.yaml
            validation-report.json
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const trace = JSON.parse(fs.readFileSync('specs/traceability.yaml', 'utf8'));
            
            const coverage = trace.specs.filter(s => s.id.startsWith('FR-')).length;
            const tests = trace.specs.filter(s => s.id.startsWith('TST-')).length;
            const tasks = trace.specs.filter(s => s.id.startsWith('TSK-')).length;
            
            const body = `## SDD-F v3.0 Validation Results
            
            | Metric | Count |
            |--------|-------|
            | Functional Requirements | ${coverage} |
            | Tests | ${tests} |
            | Tasks | ${tasks} |
            | Total Specs | ${trace.specs.length} |
            
            ✅ Validation passed - no orphan deliverables
            
            *Generated by SDD-F v3.0 validator*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
