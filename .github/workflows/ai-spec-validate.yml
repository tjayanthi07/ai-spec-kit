name: AI Spec Kit v3.0 Validation

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  SPECS_DIR: examples/user-login-v3/specs

jobs:
  validate-specs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for drift detection

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Validate specs
        run: |
          echo "Running AI Spec Kit v3.0 validator..."
          node tools/ai-spec-validate-enhanced.js "$SPECS_DIR" --ci
        continue-on-error: false

      - name: Check traceability
        run: |
          echo "Checking traceability matrix..."
          node -e "
            const fs = require('fs');
            const trace = JSON.parse(fs.readFileSync('$SPECS_DIR/traceability.yaml', 'utf8'));
            const specs = trace.specs || trace;
            const orphans = specs.filter(s => 
              ['Task', 'Test', 'Implementation'].includes(s.type) && 
              (!s.parent || s.parent.length === 0)
            );
            if (orphans.length > 0) {
              console.error('Orphan deliverables found:', orphans.map(o => o.id));
              process.exit(1);
            }
            console.log('No orphan deliverables');
          "

      - name: Verify commit trailers
        if: github.event_name == 'pull_request'
        run: |
          echo "Checking commit trailers..."
          git log --format='%s' "origin/${{ github.base_ref }}..HEAD" | while read subject; do
            if echo "$subject" | grep -qE '(Spec-Ref:|Bug-Ref:)'; then
              echo "Commit has spec reference: $subject"
            else
              echo "Commit missing spec reference: $subject"
            fi
          done

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-spec-validation-report
          path: ${{ env.SPECS_DIR }}/traceability.yaml
          retention-days: 30
          if-no-files-found: warn

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const trace = JSON.parse(fs.readFileSync('${{ env.SPECS_DIR }}/traceability.yaml', 'utf8'));
            const specs = trace.specs || trace;
            
            const frs = specs.filter(s => s.id && s.id.startsWith('FR-')).length;
            const tests = specs.filter(s => s.id && s.id.startsWith('TST-')).length;
            const tasks = specs.filter(s => s.id && s.id.startsWith('TSK-')).length;
            
            const body = `## AI Spec Kit v3.0 Validation Results
            
            | Metric | Count |
            |--------|-------|
            | Functional Requirements | ${frs} |
            | Tests | ${tests} |
            | Tasks | ${tasks} |
            | Total Specs | ${specs.length} |
            
            Validation completed.
            
            *Generated by AI Spec Kit v3.0 validator*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
